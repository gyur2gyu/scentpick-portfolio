<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScentPick · 나에게 맞는 향수 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f5;--sf:#fff;--tint:#e4f6ea;--ink:#111816;--mut:#5b6761;--acc:#00803a;--onacc:#fff;--line:#dce4df;
--serif:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1411;--sf:#151d19;--tint:#14301f;--ink:#eef4f0;--mut:#9fb0a7;--acc:#3ddc84;--onacc:#04140a;--line:#26332c}}
:root[data-theme="dark"]{--bg:#0e1411;--sf:#151d19;--tint:#14301f;--ink:#eef4f0;--mut:#9fb0a7;--acc:#3ddc84;--onacc:#04140a;--line:#26332c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:20px 22px 28px}
.top{height:44px;display:flex;align-items:center;gap:14px}
.back{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;padding:8px 0;visibility:hidden}
.bar{flex:1;height:1px;background:var(--line);position:relative}
.bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);width:0;transition:width .6s cubic-bezier(.3,.7,.2,1)}
.cnt{font-size:13px;color:var(--mut);min-width:28px;text-align:right}
main{flex:1;display:flex;flex-direction:column;padding-top:28px}
.step{animation:in .55s cubic-bezier(.3,.7,.2,1) both;display:flex;flex-direction:column;flex:1}
.step.out{animation:out .28s ease-in both}
@keyframes in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-26px)}}
h1,h2,h3{font-family:var(--serif);font-weight:300;margin:0;letter-spacing:-.01em}
h1{font-size:40px;line-height:1.3}
h2{font-size:28px;line-height:1.4;margin-bottom:10px}
.sub{color:var(--mut);font-size:15px;margin:0 0 26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;text-align:left;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:14px 14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.opt b{display:block;font-weight:500;font-size:15px}
.opt span{display:block;font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:2px}
.opt.on{background:var(--sel);color:var(--selt);border-color:var(--sel)}
.opt.on span{color:inherit;opacity:.75}
.opt .rk{position:absolute;right:10px;top:8px;font-size:12px;opacity:0}
.opt.on .rk{opacity:.9}
.list{display:flex;flex-direction:column;gap:10px}
.list .opt{padding:16px}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.foot{margin-top:auto;padding-top:26px}
.btn{width:100%;font:500 16px var(--sans);padding:16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;transition:opacity .2s}
.btn:disabled{opacity:.28;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.intro{justify-content:center;padding-bottom:8vh}
.intro p{color:var(--mut);margin:18px 0 40px}
.intro h1{font-size:clamp(29px,7.7vw,33px);line-height:1.35}
.stage{justify-content:center;align-items:flex-start;padding-bottom:10vh}
.stage .msg{font-family:var(--serif);font-weight:300;font-size:24px;min-height:70px;transition:opacity .4s}
.stage .notes{color:var(--mut);font-size:14px;margin-top:8px;min-height:22px}
.thin{width:100%;height:1px;background:var(--line);margin-top:34px;position:relative}
.thin i{position:absolute;left:0;top:-1px;height:3px;background:var(--acc);width:0;transition:width .9s linear}
.top1{border-top:1px solid var(--ink);padding-top:22px;margin-top:6px}
.pct{font-size:13px;color:var(--mut)}
.pname{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.35;margin:6px 0 4px}
.brand{color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.chips em{font-style:normal;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.why{font-family:var(--serif);font-weight:300;font-size:17px;line-height:1.9}
.meta{font-size:13px;color:var(--mut);margin-top:12px}
.more{margin-top:34px}
.more h3{font-size:18px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row b{font-weight:500;display:block}
.row span{font-size:13px;color:var(--mut)}
.row .p{white-space:nowrap;font-size:13px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:22px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.bt{display:flex;align-items:center;gap:10px;height:36px;font:500 15px var(--serif);letter-spacing:.02em}
.bi{width:16px;height:20px;flex:none;color:var(--acc)}
h1,h2,h3{font-weight:500}
h1{font-size:42px;line-height:1.35}
h2{font-size:27px;line-height:1.45}
.qn{color:var(--acc);font-size:14px;font-weight:500;margin-bottom:12px}
.bar{height:3px;background:var(--line);-webkit-mask:repeating-linear-gradient(90deg,#000 0,#000 calc(33.3333% - 5px),transparent calc(33.3333% - 5px),transparent 33.3333%);mask:repeating-linear-gradient(90deg,#000 0,#000 calc(33.3333% - 5px),transparent calc(33.3333% - 5px),transparent 33.3333%)}
.bar i{top:0;height:3px;background:var(--acc)}
.cnt{display:none}
.opt{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px}
.opt.on{background:var(--tint);color:var(--ink);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.on span{color:var(--mut);opacity:1}
.opt.on .rk{color:var(--acc);opacity:1;font-weight:500}
.btn{background:var(--acc);color:var(--onacc);border-color:var(--acc);border-radius:14px}
.btn:disabled{background:var(--line);color:var(--mut);border-color:var(--line);opacity:1}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.top1{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:24px}
.pct{color:var(--acc);font-weight:500}
.chips em{background:var(--tint);color:var(--acc);border:0}
.why{font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.85}
.thin{height:3px;background:var(--line)}
.thin i{top:0;height:3px;background:var(--acc)}
/* 모바일: 연녹색 배경 대신 화사한 흰색 (PC 카드 레이아웃은 그대로) */
@media (max-width:719px) and (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff}}
@media (max-width:719px){:root[data-theme="light"]{--bg:#fff}}
@media (min-width:720px){body{display:flex;align-items:center}.app{width:100%;max-width:440px;min-height:0;height:min(820px,92vh);background:var(--sf);border:1px solid var(--line);border-radius:28px;padding:26px 26px 30px;overflow-y:auto;box-shadow:0 20px 60px rgba(29,27,38,.08)}}
h1,h2,h3,.pname,.stage .msg{font-weight:800;letter-spacing:-.03em}
h1{font-size:44px;line-height:1.25}
h2{font-size:27px;line-height:1.35}
.bt{font-weight:700;letter-spacing:-.01em}
.qn{font-weight:700;font-size:15px}
.pct{font-weight:700}
.opt b,.row b{font-weight:700}
.btn{font-weight:700}
.why{font-weight:400;color:var(--ink)}
.btn{background:#03c75a;border-color:#03c75a;color:#04140a}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--mut)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.pname{font-size:26px;line-height:1.35}
.row .p{text-align:right}

/* Experienced-user mode, visually aligned with the existing Claude UI. */
.entry-options{display:grid;gap:12px;width:100%;margin-top:12px}
.entry-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:16px;padding:19px;display:flex;flex-direction:column;gap:5px;cursor:pointer;font:inherit}
.entry-card:hover,.entry-card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.entry-card b{font-size:17px}.entry-card span:not(.entry-symbol){font-size:13px;color:var(--mut)}
.entry-symbol{font-size:26px;line-height:1.2;color:var(--acc)}
.exp-label{font-size:13px;font-weight:700;display:block;margin:8px 0 8px}
.exp-search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sf);color:var(--ink);font:inherit;font-size:14px;outline-offset:2px}
.exp-search:focus-visible{outline:2px solid var(--acc)}
.exp-picked{margin:16px 0 9px;min-height:35px}.exp-chips{display:flex;flex-wrap:wrap;gap:6px}
.exp-chip{border:1px solid var(--acc);border-radius:40px;background:var(--tint);color:var(--ink);padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}
.exp-chip b{font-size:17px;margin-left:3px}
.exp-search-info{font-size:12px;color:var(--mut);margin:7px 0}
.exp-search-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:310px;min-height:120px;padding:2px 2px 5px}
.exp-item{border:1px solid var(--line);border-radius:12px;background:var(--sf);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;text-align:left;cursor:pointer;font:inherit}
.exp-item.selected{border-color:var(--acc);background:var(--tint)}.exp-item:disabled{opacity:.45;cursor:not-allowed}
.exp-item:focus-visible{outline:2px solid var(--acc)}
.exp-item-text{min-width:0;display:block}.exp-item-text b{display:block;font-size:13px}.exp-item-text small{display:block;color:var(--mut);font-size:11px;margin-top:3px;overflow-wrap:anywhere}
.exp-item-mark{font-weight:700;font-size:20px;color:var(--acc);min-width:20px;text-align:center}
.exp-empty{color:var(--mut);font-size:13px;padding:20px 8px;text-align:center}
.exp-disclaimer{color:var(--mut);font-size:11px;line-height:1.6;margin:9px 0}
.exp-summary{border:1px solid var(--line);background:var(--sf);border-radius:16px;padding:16px;margin:16px 0 20px}
.exp-taste{display:flex;flex-wrap:wrap;gap:7px}.exp-taste-tag{padding:6px 10px;border-radius:25px;background:var(--tint);color:var(--ink);font-size:12px}
.exp-taste-tag b{margin-left:5px;color:var(--acc);font-variant-numeric:tabular-nums}
.exp-section-title{font-size:18px;margin:10px 0 12px}
.exp-result{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:12px}
.exp-first{border-color:var(--acc)}.exp-result-top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--acc);font-size:12px;font-weight:700}
.exp-result-top b{font-size:20px;font-variant-numeric:tabular-nums}.exp-result-name{font-size:18px;line-height:1.4;font-weight:800;margin:7px 0 4px}
.exp-matched{margin-top:10px;font-size:13px}.exp-result .meta{margin-top:8px}
.exp-reset{margin-top:9px}
@media(max-width:440px){.app{padding-left:16px;padding-right:16px}}

/* 추천 계산 중 진행 표시 - 두 경로 공통 */
.stage .msg{min-height:0;margin-bottom:22px}
.chk{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:16px}
.chk li{display:flex;gap:12px;align-items:flex-start;opacity:.35;transition:opacity .4s}
.chk li.act,.chk li.done{opacity:1}
.ck{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:2px solid var(--line);position:relative;transition:background .3s,border-color .3s}
.chk li.act .ck{border-top-color:var(--acc);animation:spin .8s linear infinite}
.chk li.done .ck{background:var(--acc);border-color:var(--acc)}
.chk li.done .ck::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--onacc);border-width:0 2px 2px 0;transform:rotate(45deg);animation:pop .3s ease-out both}
.chk b{display:block;font-size:15px;font-weight:700;line-height:1.5}
.chk small{display:block;font-size:13px;color:var(--mut);line-height:1.5;overflow-wrap:anywhere}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:rotate(45deg) scale(.4)}to{opacity:1;transform:rotate(45deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.chk li.act .ck{animation:none;border-color:var(--acc)}}

/* 브랜드 / 노트 구분 + 타입 스케일 정리 */
h1,h2,h3{word-break:keep-all}
.bname{display:block;font-size:13px;font-weight:700;color:var(--mut);line-height:1.4;letter-spacing:-.01em}
.top1 .pname{font-size:26px;margin:2px 0 3px}
.brand{font-size:13px;color:var(--mut)}
.nrow{margin-top:16px}
.nl{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:7px}
.nrow .chips{margin:0;gap:5px}
.nrow .chips em{font-size:13px;padding:3px 11px}
.more .row{align-items:flex-start;padding:18px 0}
.row .rl{min-width:0}
.row .rl b{font-size:17px;line-height:1.4;margin:1px 0 9px;font-weight:800;letter-spacing:-.02em}
.top1 .nrow{margin-bottom:18px}
.why,.sub,.meta,.note,.exp-matched{word-break:keep-all}
.row .p{font-size:13px;line-height:1.6;padding-top:2px}
.row .p strong{display:block;color:var(--acc);font-size:15px;margin-top:2px}
.exp-result-name{font-size:17px;margin:2px 0 3px}
.exp-result .brand{margin-bottom:0}
.exp-result .nrow{margin-top:12px}
.exp-result-top{font-size:13px}.exp-result-top b{font-size:18px}
.exp-matched{font-size:13px;color:var(--mut)}
.pk-list{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 20px}
.pk{font-size:13px;line-height:1.4;border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:5px 12px}
.pk span{color:var(--mut);margin-right:5px}
.hb{display:flex;flex-direction:column;gap:15px;margin-top:16px}
.hb-row{display:grid;grid-template-columns:112px 1fr 40px;align-items:center;gap:10px}
.hb-label{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:700;line-height:1.3}
.hb-label .be{flex:none;font-size:15px}
.hb-track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.hb-track i{display:block;height:100%;width:0;border-radius:99px;background:var(--acc);transition:width .9s cubic-bezier(.3,.7,.2,1)}
.hb-pct{font-size:13px;font-weight:700;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.hb-row:first-child .hb-pct{color:var(--ink)}
.exp-summary .exp-label{margin-top:0;font-size:15px}
.opt b{font-size:16px}.opt span{font-size:13px}
.exp-search{font-size:16px}
.exp-item-text b{font-size:15px}.exp-item-text small{font-size:12px}
.exp-chip{font-size:13px}
.exp-disclaimer,.exp-search-info,.note{font-size:12px}
.meta{font-size:13px}
.exp-section-title,.more h3{font-size:18px}

/* 로고: ScentPick + 체크 */
.bt{gap:8px;font-size:18px;font-weight:800;letter-spacing:-.03em}
.bi{width:22px;height:22px}
.bi circle{fill:var(--acc)}
.bi path{stroke:var(--onacc)}

/* 첫 화면 / 향수 선택 화면 정리 */
.intro h1{font-size:clamp(22px,6.8vw,30px);white-space:nowrap;letter-spacing:-.04em}
.entry-symbol{width:44px;height:44px;border-radius:12px;background:var(--tint);display:grid;place-items:center;margin-bottom:8px;line-height:1}
.entry-symbol svg{width:24px;height:24px}
.exp-picked{margin:18px 0 24px;padding:14px 14px 15px;min-height:0;border:1px dashed var(--line);border-radius:14px;transition:border-color .2s,background .2s}
.exp-picked.has{border:1px solid var(--acc);background:var(--tint)}
.exp-picked .exp-label{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:13px}
.exp-picked .exp-label em{font-style:normal;color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums}
.exp-picked .exp-chip{background:var(--sf)}
.exp-pick-empty{margin:0;font-size:13px;color:var(--mut)}
.exp-search-info{margin:10px 0 8px;font-size:12px;color:var(--mut)}
.exp-label[for]{margin-top:0}

/* 선택 칩: 브랜드(흐림)+이름, × 바로 옆 / 라벨 크기 */
.exp-picked .exp-label{font-size:16px;font-weight:800;margin-bottom:12px}
.exp-picked .exp-label em{font-size:14px}
.exp-chips{gap:7px}
.exp-picked .exp-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px 6px 12px;font-size:13px;line-height:1.4;background:var(--sf);border:1px solid var(--line);color:var(--ink)}
.exp-chip .cb{color:var(--mut);margin-right:1px}
.exp-chip .cx{flex:none;width:12px;height:12px;margin-left:3px;fill:none;stroke:var(--mut);stroke-width:1.6;stroke-linecap:round}
.exp-chip:hover .cx{stroke:var(--ink)}
.exp-chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pk-list{margin:8px 0 22px;gap:7px}

/* 향 선택 카드: 이모지 + 라벨 (막대그래프와 같은 아이콘 체계) */
.oe,.hb-label .be{font-style:normal;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.grid .opt b{display:flex;align-items:center;gap:8px;line-height:1.35}
.grid .opt .oe{flex:none;width:22px;text-align:center;font-size:18px;line-height:1}
.grid .opt>span{margin-top:5px;word-break:keep-all}
.grid .opt .rk{top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--onacc);font-size:12px;font-weight:800;opacity:0;transform:scale(.5);transition:opacity .18s,transform .18s}
.grid .opt.on .rk{opacity:1;transform:scale(1);color:var(--onacc);font-weight:800}
.grid .opt b{word-break:keep-all}
@media (max-width:360px){.grid .opt{padding:14px 12px}.grid .opt b{font-size:15px;gap:6px}.grid .opt .oe{width:20px;font-size:16px}}

/* 안내 문구: 문장 단위 줄바꿈 + 균형 있는 줄 나눔 */
.sub,.intro p,.exp-disclaimer{text-wrap:balance;word-break:keep-all}

/* 이전 버튼: 아이콘 + 진한 글자 + 테두리 알약, 터치 영역 확대 */
.top{height:48px}
.back{position:relative;display:inline-flex;align-items:center;gap:1px;height:36px;padding:0 14px 0 8px;border:1px solid var(--line);border-radius:99px;background:var(--sf);color:var(--ink);font-size:14px;font-weight:700;line-height:1;-webkit-tap-highlight-color:transparent}
.back::after{content:"";position:absolute;inset:-6px -8px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* 상단 영역 비율: 로고 - 이전/진행바 - 본문 간격 정리 */
.top{margin-top:18px;height:40px}
main{padding-top:20px}

/* 추천 결과 안내 카드 */
.notice{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px 16px 16px;margin:0 0 14px}
.nt-flow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.nt-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 8px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.nt-pill .oe{font-size:15px;line-height:1}
.nt-pill.off{border:1px dashed var(--mut);color:var(--mut)}
.nt-pill.on{background:var(--tint);color:var(--acc)}
.nt-arr{flex:none;width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nt-title{font-size:16px;font-weight:800;line-height:1.45;letter-spacing:-.02em;word-break:keep-all;margin:0 0 6px}
.nt-body{font-size:14px;line-height:1.65;color:var(--mut);word-break:keep-all;margin:0}
.nt-body b{color:var(--ink);font-weight:700}
.nt-act{margin-top:14px;height:46px;font-size:15px}

/* 안내 카드: 중앙 정렬 */
.notice{text-align:center}
.nt-flow{justify-content:center}
.nt-plus{color:var(--mut);font-weight:700;font-size:16px;line-height:1}
.nt-body,.nt-title{text-wrap:balance}
.nt-act{display:flex;align-items:center;justify-content:center;width:fit-content;min-width:200px;margin:16px auto 0;padding:0 24px}

/* 300종 서비스용 결과 카드: 감성 소개 / 추천 근거 / 제품 사양의 명확한 위계 */
.top1 .scent-feature{margin-top:23px;padding:1px 0 1px 15px;border-left:3px solid var(--acc)}
.top1 .scent-kicker,.top1 .reason-label{font-size:12px;font-weight:700;line-height:1.5;letter-spacing:.015em;color:var(--mut)}
.top1 .scent-feature-line{margin:8px 0 1px;font-size:clamp(17px,4.5vw,20px);font-weight:800;line-height:1.58;letter-spacing:-.025em;color:var(--ink);word-break:keep-all;text-wrap:pretty}
.top1 .reason-panel{margin-top:23px;padding-top:16px;border-top:1px solid var(--line)}
.top1 .reason-panel .why{margin:7px 0 0;font-size:13px;line-height:1.85;font-weight:400;color:var(--mut);letter-spacing:-.005em;word-break:keep-all}
/* 제품 사양: 작은 화면에서도 읽히는 레이블 및 값, 가격 열에는 충분한 폭 */
.top1 .result-specs{margin-top:23px;padding:17px 15px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.35fr) minmax(0,1fr);gap:8px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.top1 .spec-item{min-width:0;display:flex;flex-direction:column;gap:6px}
.top1 .spec-label{font-size:13px;line-height:1.35;color:var(--mut);font-weight:600}
.top1 .spec-value{font-size:clamp(13px,3.9vw,16px);line-height:1.4;color:var(--ink);font-weight:800;letter-spacing:-.028em;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 결과 제목과 브랜드·영문명·주요 노트는 동일한 카드 내부 기준선 사용 */
.top1 > .result-card-head,.top1 > .pname,.top1 > .brand,.top1 > .nrow{margin-inline-start:0;padding-inline-start:0}
.top1 > .pname{display:block;text-indent:-1px}
.top1 .nrow{margin-top:19px}
.top1 .nrow .chips{margin-top:0}
@media(max-width:359px){
 .top1{padding:18px}
 .top1 .result-specs{padding:14px 10px;gap:5px}
 .top1 .spec-label{font-size:12px}
 .top1 .spec-value{letter-spacing:-.03em}
}

/* 1위 추천 점수: 카드 우측 상단의 절제된 보조 지표 */
.top1 .result-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0}
.top1 .result-card-head .bname{min-width:0;margin:0}
.top1 .result-card-head .pct{flex-shrink:0;white-space:nowrap;color:var(--acc);font-weight:800;font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
</style>

/**
 * Rule-based experienced-perfume recommender (300-item dataset).
 * No online API or generative-AI calls. Input 'rows' has [{id,accords:[{rank,accord,weight}]}].
 * Main accords remain separate. Only clean/soap <-> aldehydic receives a partial affinity.
 * Score is a similarity indicator, not a predicted satisfaction probability.
 */
const ExpertRecommender = (() => {
  "use strict";
  const PARTIAL_AFFINITY = 0.45;
  const ACCORD_A = "클린·비누";
  const ACCORD_B = "알데하이딕";

  function buildVector(accords) {
    const v = Object.create(null);
    for (const a of accords) {
      if (!a || !a.accord || !Number.isFinite(a.weight) || a.weight <= 0) continue;
      v[a.accord] = (v[a.accord] || 0) + a.weight;
    }
    return v;
  }

  function dot(v, w) {
    let sum = 0;
    for (const k of Object.keys(v)) sum += v[k] * (w[k] || 0);
    // Related, not identical; symmetric matrix remains positive definite at |affinity| < 1.
    sum += PARTIAL_AFFINITY * ((v[ACCORD_A] || 0) * (w[ACCORD_B] || 0)
                                  + (v[ACCORD_B] || 0) * (w[ACCORD_A] || 0));
    return sum;
  }

  function similarity(v, w) {
    const a = dot(v,v), b = dot(w,w);
    if (a <= 0 || b <= 0) return 0;
    return Math.max(0,Math.min(1, dot(v,w) / Math.sqrt(a*b)));
  }

  function tasteProfile(rows, selectedIds) {
    const lookup=new Map(rows.map(r=>[r.id,r]));
    const selected=[...new Set(selectedIds.map(Number))].filter(id=>lookup.has(id));
    if (!selected.length || selected.length>5) throw new Error("좋아하는 향수를 1~5종 선택해 주세요.");
    const v=Object.create(null);
    for (const id of selected) {
      const row=lookup.get(id);
      for (const a of row.accords) v[a.accord]=(v[a.accord]||0)+a.weight/selected.length;
    }
    const top=Object.entries(v).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko'))
      .map(([name,score])=>({name,score:Math.round(score*100)/100}));
    return {selectedIds:selected, vector:v, top};
  }

  function recommend(perfumes, rows, selectedIds, maxResults=5) {
    const taste=tasteProfile(rows,selectedIds);
    const rowById=new Map(rows.map(r=>[r.id,r]));
    const selected=new Set(taste.selectedIds);
    const ranked=[];
    for (const p of perfumes) {
      if (selected.has(p.id)) continue;
      const row=rowById.get(p.id);
      if (!row) continue;
      const v=buildVector(row.accords);
      const sim=similarity(taste.vector,v);
      if (sim < 0.00001) continue;
      const common=Object.keys(v).filter(k=>taste.vector[k]>0).sort((a,b)=>
        taste.vector[b]*v[b]-taste.vector[a]*v[a]||a.localeCompare(b,'ko'));
      const related=((taste.vector[ACCORD_A]||0)>0 && (v[ACCORD_B]||0)>0)
                    || ((taste.vector[ACCORD_B]||0)>0 && (v[ACCORD_A]||0)>0);
      ranked.push({p, profile:row, score:Math.round(sim*1000)/10,
                   similarity:sim, common:common.slice(0,4), related});
    }
    const tbSeed=taste.selectedIds.slice().sort((x,y)=>x-y).join(",");
    const tbHash=id=>{const t=tbSeed+"|"+id;let h=2166136261;for(let k=0;k<t.length;k++){h^=t.charCodeAt(k);h=Math.imul(h,16777619)}return h>>>0};
    ranked.sort((a,b)=>b.similarity-a.similarity||b.common.length-a.common.length||tbHash(a.p.id)-tbHash(b.p.id));
    return {taste, items:ranked.slice(0,maxResults), candidates:ranked.length,
            total:perfumes.length, excluded:selected.size};
  }

  return {buildVector,dot,similarity,tasteProfile,recommend,PARTIAL_AFFINITY};
})();
if (typeof module !== "undefined" && module.exports) module.exports=ExpertRecommender;

   };
   action.disabled=EXPERT_SELECTED.length===0;
   action.textContent=EXPERT_SELECTED.length===0?'향수 선택 후 추천받기':EXPERT_SELECTED.length+'종으로 취향 분석하기';
 }
 search.addEventListener('input',()=>{EXPERT_QUERY=search.value;paint()});
 action.onclick=()=>{if(!EXPERT_SELECTED.length||busy)return;
   EXPERT_RESULT=ExpertRecommender.recommend(PERFUMES,EXPERT_ACCORD_ROWS,EXPERT_SELECTED);
   go(-3);
 };
 paint();
}
function expertResult(d){
 if(!EXPERT_RESULT || !EXPERT_RESULT.taste){go(-2);return}
 const r=EXPERT_RESULT,t=r.taste;
 const picked=t.selectedIds.map(id=>{const p=PERFUMES.find(p=>p.id===id);return '<span class="pk"><span>'+esc(p.koBrand)+'</span>'+esc(nm(p.koName))+'</span>'}).join('');
 const max=t.top.length?t.top[0].score:1;
 const bars=t.top.slice(0,6).map(x=>{const pc=Math.max(1,Math.round(x.score/max*100));
   return '<div class="hb-row"><span class="hb-label"><span class="be" aria-hidden="true">'+(EMO[x.name]||"◦")+'</span>'+esc(x.name)+'</span>'
    +'<span class="hb-track" role="img" aria-label="'+esc(x.name)+' '+pc+'%"><i data-w="'+pc+'"></i></span><span class="hb-pct">'+pc+'%</span></div>'}).join('');
 let html='<h2>선택한 향수에서 발견한<br>공통 취향</h2>'
  +'<div class="pk-list">'+picked+'</div>'
  +'<div class="exp-summary"><div class="exp-label">선호하는 향의 특징</div><div class="hb">'+bars+'</div>'
  +'<p class="exp-disclaimer" style="margin-bottom:0">가장 두드러진 향을 100%로 둔 상대 비율이에요.</p></div>';
 if(!r.items.length){
   html+='<h3>현재 데이터에서 유사한 향수를 찾지 못했어요.</h3><p class="sub">다른 향수를 추가해 보세요.</p>';
 }else{
   html+='<h3 class="exp-section-title">유사한 향수 추천 TOP '+r.items.length+'</h3>';
   html+=r.items.map((x,n)=>{
      const p=x.p;
      return '<article class="exp-result '+(n===0?'exp-first':'')+'">'
       +'<div class="exp-result-top"><span>'+(n+1)+'위 · 어코드 유사도</span><b>'+x.score.toFixed(1)+'</b></div>'
       +'<span class="bname" style="margin-top:8px">'+esc(p.koBrand)+'</span><div class="exp-result-name">'+esc(nm(p.koName))+'</div><div class="brand">'+esc(p.brand+' '+p.name)+'</div>'
       +(x.common.length?noteList('공통 어코드',x.common):'<div class="exp-matched" style="margin-top:12px">관련 어코드 특성이 일부 반영됨</div>')
       +'<div class="meta">지속력 '+esc(p.longevityLevel)+' · '+p.volumeMl+'ml · '+'정가'+' '+won(p.listPriceKrw)+'</div>'
       +'</article>';
   }).join('');
 }
 html+='<div class="foot"><button class="btn ghost" id="exp-edit">선택한 향수 수정하기</button><button class="btn ghost exp-reset" id="exp-reset">처음 화면으로</button></div>';
 d.innerHTML=html;
 requestAnimationFrame(()=>requestAnimationFrame(()=>d.querySelectorAll(".hb-track i").forEach((e,k)=>{e.style.transitionDelay=(k*70)+"ms";e.style.width=e.dataset.w+"%"})));
 $("exp-edit").onclick=()=>go(-2);
 $("exp-reset").onclick=reset;
}

$("back").onclick=()=>{
 if(busy)return;
 if(i===-2){EXPERT_SELECTED=[];EXPERT_QUERY="";EXPERT_RESULT=null;go(-1)}
 else if(i===-4)go(-2); // 결과의 '선택한 향수 수정'에서는 선택 유지
 else if(i===0){A.likes=[];A.avoid=[];go(-1)}
 else if(i>0&&i<6)go(i-1);
};
render();
</script>
</body>
</html>
